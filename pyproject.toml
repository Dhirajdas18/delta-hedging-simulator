[project]
name = "delta-hedging-simulator"
version = "0.1.0"
description = "A delta hedging simulator and studies on real NIFTY and NSE stock options, 2015-2026: path dependence of hedged P&L, which volatility to hedge at, rebalancing after Indian costs, overnight gaps, gamma hedging, single stocks, and whether selling and hedging pays, with a live simulator."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhirajdas18" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
dhs = "dhs.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dhs"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
